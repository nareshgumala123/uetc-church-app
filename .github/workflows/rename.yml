name: Rename to index.html
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename church-app-starter.html to index.html
        run: |
          set -e
          git config user.name "nareshgumala123"
          git config user.email "nareshgumala123@users.noreply.github.com"
          test -f church-app-starter.html
          git mv church-app-starter.html index.html
          git status --short
          git commit -m "Rename church-app-starter.html to index.html"
          git push origin HEAD:main
